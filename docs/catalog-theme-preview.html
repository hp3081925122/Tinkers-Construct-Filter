<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>匠魂焦黑熔炉风 · 图鉴三栏工作台材质预览</title>
<style>
body{margin:24px;background:#121010;color:#eae0d2;font:15px "Microsoft YaHei",sans-serif}
main{max-width:1180px;margin:auto}h1{font-size:22px;margin:0 0 6px;color:#f2b84b}p{margin:0 0 12px;color:#a89b8e}
canvas{width:100%;height:auto;image-rendering:pixelated;display:block;border:1px solid #4a2817;background:#0d0b0b}
button{background:#38302c;color:#eae0d2;border:1px solid #94542e;padding:6px 14px;margin:0 8px 12px 0;cursor:pointer}
button.active{background:#4e3623;color:#f2b84b;border-color:#f2b84b}
small{display:block;margin-top:10px;color:#a89b8e}
</style>
<main>
<h1>匠魂焦黑熔炉风 · 三栏工作台图鉴材质预览</h1>
<p>使用与 CatalogSkin 完全相同的 256×256 精灵坐标与九宫格切片逻辑实时渲染（2× 像素比例）。</p>
<div>
  <button id="view-materials" class="active">材料三栏检视</button>
  <button id="view-modifiers">强化配方检视</button>
  <button id="view-filters">展开筛选弹层</button>
</div>
<canvas id="preview" width="580" height="350"></canvas>
<small id="status">正在加载 catalog_atlas.png …</small>
</main>
<script>
const canvas = document.getElementById('preview'), ctx = canvas.getContext('2d'), atlas = new Image()
let mode = 'materials', quads = 0
atlas.src = '../src/main/resources/assets/tinkers_construct_filter/textures/gui/catalog_atlas.png'
ctx.imageSmoothingEnabled = false

const S = {
  WINDOW:[0,0,48,48,8], HEADER:[52,0,32,24,5], SIDEBAR:[88,0,24,24,4], LIST:[116,0,24,24,4],
  DETAIL:[144,0,32,32,6], CARD:[180,0,24,24,4], POPUP:[208,0,28,28,5],
  BTN:[0,52,20,20,4], BTN_H:[24,52,20,20,4], BTN_S:[48,52,20,20,4],
  TAB:[96,52,24,22,4], TAB_H:[124,52,24,22,4], TAB_S:[152,52,24,22,4],
  ST_H:[206,52,22,22,4],
  ROW:[0,80,24,24,3], ROW_A:[28,80,24,24,3], ROW_H:[56,80,24,24,3], ROW_P:[84,80,24,24,4],
  SLOT:[112,80,18,18,2], SLOT_H:[134,80,18,18,2], PED:[156,80,22,22,3],
  CHIP:[182,80,20,13,3], CHIP_H:[206,80,20,13,3], PILL:[182,96,20,13,3], PILL_H:[206,96,20,13,3], BADGE:[230,80,16,11,3],
  IN_F:[48,112,20,20,3], TRACK:[72,112,6,16,2], THUMB:[82,112,6,16,2], THUMB_H:[92,112,6,16,2]
}

function blit(x,y,w,h,u,v,sw,sh){
  if(w<=0||h<=0)return
  ctx.drawImage(atlas,u,v,sw,sh,x,y,w,h);quads++
}
function draw(sp,x,y,w,h){
  const [u,v,sw,sh,b]=sp
  if(!b||(w===sw&&h===sh)){blit(x,y,w,h,u,v,sw,sh);return}
  const bx=Math.min(b,w>>1),by=Math.min(b,h>>1)
  for(let r=0;r<3;r++){
    const ty=r===0?0:r===1?by:h-by,dh=r===1?h-by*2:by,sy=r===0?0:r===1?b:sh-by,sh2=r===1?sh-b*2:by
    for(let c=0;c<3;c++){
      const lx=c===0?0:c===1?bx:w-bx,dw=c===1?w-bx*2:bx,sx=c===0?0:c===1?b:sw-bx,sw2=c===1?sw-b*2:bx
      if(dw>0&&dh>0)blit(x+lx,y+ty,dw,dh,u+sx,v+sy,sw2,sh2)
    }
  }
}
function txt(s,x,y,c='#eae0d2',sz=9){ctx.font=sz+'px "Microsoft YaHei",sans-serif';ctx.fillStyle=c;ctx.fillText(s,x,y)}

function render(){
  quads=0;ctx.fillStyle='#100d0d';ctx.fillRect(0,0,580,350)
  draw(S.ST_H,4,4,22,22);blit(7,7,16,16,80,140,16,16)
  const px=28,py=10,pw=542,ph=330
  draw(S.WINDOW,px,py,pw,ph)
  draw(S.HEADER,px+7,py+7,pw-14,22);blit(px+12,py+10,16,16,80,140,16,16)
  txt('匠魂图鉴',px+32,py+21,'#f2b84b',10);txt('›  '+(mode==='modifiers'?'匠魂强化':'匠魂材料'),px+82,py+21,'#a89b8e',9)
  draw(S.BTN,px+pw-25,py+9,16,16);blit(px+pw-21,py+13,9,9,72,164,9,9)

  const bt=py+33,bh=ph-40,nw=104
  draw(S.SIDEBAR,px+7,bt,nw,bh)
  ;[['匠魂材料',0,'68'],['匠魂部件',20,'529'],['匠魂强化',40,'142'],['匠魂词条',60,'215']].forEach(([n,iu,cnt],i)=>{
    const ty=bt+4+i*24,sel=(mode==='modifiers'?i===2:i===0)
    draw(sel?S.TAB_S:i===1?S.TAB_H:S.TAB,px+10,ty,nw-6,22)
    blit(px+15,ty+3,16,16,iu,140,16,16)
    txt(n,px+35,ty+14,sel?'#f2b84b':'#eae0d2',9)
    draw(S.BADGE,px+nw-24,ty+5,20,11);txt(cnt,px+nw-21,ty+13,sel?'#f2b84b':'#a89b8e',8)
  })
  draw(S.BTN,px+11,bt+bh-24,nw-8,20);blit(px+18,bt+bh-18,9,9,60,164,9,9);txt('部件属性',px+32,bt+bh-11,'#eae0d2',9)

  const cx=px+7+nw+5,cw=pw-14-nw-5,sw=cw-158
  draw(S.IN_F,cx,bt,sw,20);blit(cx+6,bt+5,9,9,0,164,9,9);txt('搜索名称、ID、词条或词条描述',cx+19,bt+13,'#73685e',9)
  draw(mode==='filters'?S.BTN_S:S.BTN,cx+sw+4,bt,52,20);txt('筛选 2',cx+sw+16,bt+13,mode==='filters'?'#f2b84b':'#eae0d2',9)
  draw(S.BTN_H,cx+sw+59,bt,48,20);txt('排序',cx+sw+74,bt+13,'#fff8ec',9)
  draw(S.BTN,cx+sw+110,bt,48,20);txt('升序',cx+sw+125,bt+13,'#eae0d2',9)

  const sy=bt+24;txt('68 个结果',cx+2,sy+10,'#a89b8e',8)
  draw(S.CHIP,cx+48,sy,56,13);txt('材料等级 4',cx+53,sy+9,'#eae0d2',8)
  draw(S.CHIP_H,cx+108,sy,42,13);txt('浇铸',cx+113,sy+9,'#fff8ec',8)

  const ly=sy+16,lh=bt+bh-ly,lw=Math.floor(cw*0.51),dx=cx+lw+5,dw=cw-lw-5
  draw(S.LIST,cx,ly,lw,lh)
  const rows=[['玛玉灵','Lv.4','#d48cff','不知厌倦 · 战意'],['钴','Lv.3','#66c8f7','轻巧 · 迅捷'],['紫水晶青铜','Lv.3','#66c8f7','水晶绑定'],['玫瑰金','Lv.2','#e39356','强化槽 +1'],['焦黑岩石','Lv.1','#c2b7aa','灼热 · 6 种可用部件'],['黏液木','Lv.2','#e39356','过度生长']]
  rows.forEach(([name,lv,lc,sub],i)=>{
    const ry=ly+3+i*28;if(ry+28>ly+lh)return
    draw(i===0?S.ROW_P:i===1?S.ROW_H:i%2===0?S.ROW:S.ROW_A,cx+3,ry,lw-13,28)
    draw(S.SLOT,cx+8,ry+5,18,18);blit(cx+9,ry+6,16,16,(i%4)*20,140,16,16)
    txt(name,cx+31,ry+12,i===0?'#fff8ec':'#eae0d2',9);txt(lv,cx+lw-38,ry+12,lc,8)
    txt(sub,cx+31,ry+23,'#a89b8e',8)
  })
  draw(S.TRACK,cx+lw-8,ly+3,5,lh-6);draw(S.THUMB_H,cx+lw-8,ly+10,5,46)

  draw(S.DETAIL,dx,ly,dw,lh)
  draw(S.PED,dx+6,ly+6,22,22);blit(dx+9,ly+9,16,16,mode==='modifiers'?40:0,140,16,16)
  draw(S.BTN_S,dx+dw-22,ly+7,16,16);blit(dx+dw-18,ly+11,9,9,108,164,9,9)
  if(mode==='modifiers'){
    txt('急迫 III',dx+32,ly+15,'#fff8ec',9);txt('升级槽 · 采掘与远程提速',dx+32,ly+25,'#d98a54',8)
    draw(S.CARD,dx+6,ly+35,dw-12,56);draw(S.PILL_H,dx+12,ly+41,46,13);txt('急迫',dx+22,ly+50,'#f2b84b',8)
    txt('红石粉赋予工具更快挖掘与拉弓速度。',dx+12,ly+67,'#eae0d2',8)
    draw(S.CARD,dx+6,ly+96,dw-12,118);txt('消耗材料',dx+12,ly+108,'#ffb85c',8)
    for(let i=0;i<5;i++)draw(i===0?S.SLOT_H:S.SLOT,dx+12+i*19,ly+113,18,18)
    txt('适用工具',dx+12,ly+146,'#7cd67c',8)
    for(let i=0;i<14;i++)draw(S.SLOT,dx+12+(i%7)*19,ly+151+Math.floor(i/7)*20,18,18)
  }else{
    txt('玛玉灵',dx+32,ly+15,'#fff8ec',9);draw(S.BADGE,dx+dw-52,ly+7,26,11);txt('Lv.4',dx+dw-48,ly+15,'#d48cff',8)
    txt('浇铸 · 复合浇铸',dx+32,ly+25,'#d98a54',8)
    draw(S.CARD,dx+6,ly+35,dw-12,96);txt('头部',dx+12,ly+46,'#ffb85c',9)
    ;[['耐久','1250'],['挖掘速度','6.5'],['挖掘等级','下界合金'],['攻击伤害','3.5']].forEach(([k,v],j)=>{
      txt(k,dx+12,ly+60+j*12,'#a89b8e',8);txt(v,dx+dw-18-ctx.measureText(v).width,ly+60+j*12,'#fff8ec',8)
    })
    draw(S.PILL_H,dx+12,ly+111,50,13);txt('不知厌倦',dx+17,ly+120,'#f2b84b',8)
    draw(S.CARD,dx+6,ly+136,dw-12,78);txt('手柄',dx+12,ly+147,'#7cd67c',9)
    ;[['耐久倍率','1.10x'],['攻击伤害倍率','1.25x']].forEach(([k,v],j)=>{
      txt(k,dx+12,ly+161+j*12,'#a89b8e',8);txt(v,dx+dw-18-ctx.measureText(v).width,ly+161+j*12,'#fff8ec',8)
    })
  }
  if(mode==='filters'){
    draw(S.POPUP,cx+cw-210,bt+23,210,132)
    txt('材料等级',cx+cw-198,bt+36,'#f2b84b',9);txt('制作方式',cx+cw-142,bt+36,'#a89b8e',9);txt('清空',cx+cw-30,bt+36,'#f2b84b',8)
    ;['材料等级 1','材料等级 2','材料等级 3','材料等级 4'].forEach((s,i)=>{
      const oy=bt+46+i*18;if(i===3)draw(S.ROW_H,cx+cw-206,oy,202,18)
      blit(cx+cw-200,oy+4,9,9,i===3?12:0,180,9,9);txt(s,cx+cw-186,oy+12,i===3?'#f2b84b':'#eae0d2',8)
    })
  }
  document.getElementById('status').textContent=`图集 ${atlas.width}×${atlas.height} · 本帧绘制 ${quads} 个像素切片 · 左上角展示匠魂工坊 22×22 入口按钮`
}
atlas.onload=render
;[['view-materials','materials'],['view-modifiers','modifiers'],['view-filters','filters']].forEach(([id,m])=>{
  document.getElementById(id).onclick=e=>{
    mode=m;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render()
  }
})
</script>
</html>
