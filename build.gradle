buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:mantle-74924:${mantle_curseforge_file_id}")
    implementation fg.deobf("curse.maven:tinkers-construct-74072:${tconstruct_curseforge_file_id}")
    implementation fg.deobf("curse.maven:jei-238222:${jei_curseforge_file_id}")
    compileOnly fg.deobf("curse.maven:kubejs-238086:${kubejs_curseforge_file_id}")
    runtimeOnly fg.deobf("curse.maven:kubejs-238086:${kubejs_curseforge_file_id}")
    compileOnly fg.deobf("curse.maven:rhino-416294:${rhino_curseforge_file_id}")
    runtimeOnly fg.deobf("curse.maven:rhino-416294:${rhino_curseforge_file_id}")
    runtimeOnly fg.deobf("curse.maven:architectury-api-419699:${architectury_curseforge_file_id}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version: forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors: mod_authors, mod_description: mod_description]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 独立执行目录扩展回归测试，不启动客户端，也不生成发布 JAR。
tasks.register('catalogExtensionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.hp.tinkers_construct_filter.client.catalog.CatalogExtensionsTest'
    // 日志放入构建目录，示例路径使用绝对路径，不污染源码工作树。
    workingDir = layout.buildDirectory.dir('catalog-tests').get().asFile
    args file('docs/examples/catalog_extensions.js').absolutePath
    doFirst {
        workingDir.mkdirs()
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
